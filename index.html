<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trading Bot — live paper books</title>
<style>
  :root { --bg:#0b0e14; --panel:#121722; --line:#1f2735; --text:#dbe4f0;
          --dim:#7c8aa0; --green:#3ddc84; --red:#ff5c6c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text);
         font:14px/1.5 "Segoe UI", system-ui, sans-serif; display:flex; min-height:100vh; }
  #sidebar { width:250px; background:var(--panel); border-right:1px solid var(--line);
             padding:16px; flex-shrink:0; }
  #sidebar h1 { font-size:15px; margin-bottom:4px; }
  #sidebar .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  .bot-btn { display:block; width:100%; text-align:left; background:none; border:1px solid
             transparent; color:var(--text); padding:8px 10px; border-radius:6px;
             cursor:pointer; margin-bottom:4px; font:inherit; }
  .bot-btn:hover { background:var(--line); }
  .bot-btn.active { border-color:#5aa2ff; background:var(--line); }
  .bot-btn.err { color:var(--dim); }
  #main { flex:1; padding:20px 24px; max-width:1000px; }
  #cards { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:12px 16px; min-width:150px; }
  .card .label { color:var(--dim); font-size:11px; text-transform:uppercase; }
  .card .value { font-size:20px; margin-top:2px; }
  .pos .value { color:var(--green); } .neg .value { color:var(--red); }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px;
            padding:14px; margin-bottom:16px; }
  h2 { font-size:13px; color:var(--dim); margin-bottom:8px; text-transform:uppercase; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  td.num, th.num { text-align:right; }
  .empty { color:var(--dim); padding:8px; }
  .buy { color:var(--green); } .sell { color:var(--red); }
  #note { color:var(--dim); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<div id="sidebar">
  <h1>Paper books</h1>
  <div class="sub">GitHub Pages snapshot — refreshed by CI every ~15 min</div>
  <div id="botlist"></div>
</div>
<div id="main">
  <div id="cards"></div>
  <section><h2>Equity curve</h2>
    <svg id="chart" width="100%" viewBox="0 0 800 240" preserveAspectRatio="none"></svg>
  </section>
  <section><h2>Open positions</h2><table id="positions"></table></section>
  <section><h2>Recent fills</h2><table id="fills"></table></section>
  <section id="decisionsbox" style="display:none"><h2>LLM decisions</h2>
    <table id="decisions"></table></section>
</div>
<script>
const BOOKS = [
  ["race_sma.json", "Race — SMA control"],
  ["live_llm.json", "Race — GLM AI"],
  ["live_carry.json", "Race — Carry BTC"],
  ["live_carrycat.json", "Race — Carry CASHCAT"],
  ["pol_state.json", "Polymarket paper"],
  ["sol_sniper_state.json", "Solana sniper paper"],
];
let selected = null;
const $ = (id) => document.getElementById(id);
const fmtUsd = (v) => "$" + Number(v).toLocaleString(undefined,
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function normalize(data) {
  const p = data.portfolio || data;
  const curve = p.equity_curve || [];
  const fills = p.fills || p.recent_fills || [];
  const positions = p.positions || {};
  const decisions = data.decisions || null;
  const starting = p.starting_cash || 0;
  const equity = curve.length ? curve[curve.length - 1][1]
                : (p.cash != null ? p.cash : null);
  return { curve, fills, positions, decisions, starting, equity,
           usage: data.llm_usage || null,
           saved: data.saved_at || "" };
}

function evidence(fills) {
  const closed = fills.filter(f => Math.abs(f.realized || 0) > 1e-9).length;
  if (closed < 20) return `TOO EARLY (${closed} trades)`;
  if (closed < 100) return `weak-directional (${closed} trades)`;
  return `statistical (${closed} trades)`;
}

function usageCost(u) {
  if (!u || !u.calls) return null;
  const usd = (u.prompt_tokens * 1.4 + u.completion_tokens * 4.4) / 1e6;
  return `${u.calls} calls · ${usd < 0.01 ? "<$0.01" : "$" + usd.toFixed(2)}`;
}

function render(n) {
  const open = Object.values(n.positions).filter(p => p.qty != 0).length;
  const ret = (n.starting && n.equity != null) ? n.equity / n.starting - 1 : null;
  const cards = [
    ["Equity", n.equity != null ? fmtUsd(n.equity) : "—"],
    ["Return", ret != null ? (100 * ret).toFixed(2) + "%" : "—",
     ret != null && ret >= 0 ? "pos" : "neg"],
    ["Positions", String(open)], ["Fills", String(n.fills.length)],
    ["Evidence", evidence(n.fills)],
  ];
  const cost = usageCost(n.usage);
  if (cost) cards.push(["GLM cost", cost]);
  $("cards").innerHTML = cards.map(([l, v, c]) =>
    `<div class="card ${c || ""}"><div class="label">${l}</div>
     <div class="value" style="font-size:15px">${v}</div></div>`).join("");

  const curve = n.curve;
  const svg = $("chart");
  if (curve.length < 2) { svg.innerHTML =
    `<text x="12" y="30" fill="#7c8aa0" font-size="12">not enough history yet</text>`; }
  else {
    const vals = curve.map(p => p[1]);
    const min = Math.min(...vals), max = Math.max(...vals);
    const span = (max - min) || 1, W = 800, H = 240, pad = 8;
    const x = (i) => pad + (W - 2 * pad) * i / (curve.length - 1);
    const y = (v) => pad + (H - 2 * pad) * (1 - (v - min) / span);
    const poly = curve.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
    const color = vals[vals.length - 1] >= vals[0] ? "#3ddc84" : "#ff5c6c";
    svg.innerHTML = `<polyline points="${poly}" fill="none" stroke="${color}"
      stroke-width="2"/><text x="${pad + 4}" y="${y(max) + 14}" fill="#7c8aa0"
      font-size="11">${fmtUsd(max)}</text><text x="${pad + 4}" y="${y(min) - 4}"
      fill="#7c8aa0" font-size="11">${fmtUsd(min)}</text>`;
  }

  const posRows = Object.entries(n.positions).filter(([, p]) => p.qty != 0)
    .map(([s, p]) => `<tr><td>${s}</td><td class="num">${p.qty.toFixed(6)}</td>
      <td class="num">${Number(p.avg_price).toFixed(4)}</td></tr>`);
  $("positions").innerHTML = posRows.length
    ? "<tr><th>Instrument</th><th class='num'>Qty</th><th class='num'>Avg</th></tr>"
      + posRows.join("") : "<tr><td class='empty'>flat</td></tr>";

  const fillRows = n.fills.slice(-12).reverse().map(f => `<tr>
    <td>${(f.ts || "").replace("T", " ").slice(5, 16)}</td>
    <td class="${f.side}">${f.side}</td>
    <td class="num">${Number(f.qty).toFixed(5)}</td>
    <td class="num">${Number(f.price).toFixed(3)}</td>
    <td>${(f.reason || "").slice(0, 60)}</td></tr>`);
  $("fills").innerHTML = fillRows.length
    ? "<tr><th>Time</th><th>Side</th><th class='num'>Qty</th><th class='num'>Price</th><th>Reason</th></tr>"
      + fillRows.join("") : "<tr><td class='empty'>no fills yet</td></tr>";

  if (n.decisions) {
    $("decisionsbox").style.display = "";
    const isList = Array.isArray(n.decisions);
    const rows = isList
      ? n.decisions.slice(-15).reverse().map(d => `<tr>
          <td>${(d.ts || "").replace("T", " ").slice(5, 16)}</td>
          <td>${d.action}</td>
          <td class="num">${Number(d.conviction || 0).toFixed(2)}</td>
          <td>${(d.reason || "").slice(0, 60)}</td></tr>`)
      : Object.entries(n.decisions).slice(-15).reverse().map(([id, d]) => `<tr>
          <td>${(d.question || id).slice(0, 55)}</td>
          <td class="num">${d.probability != null ? d.probability.toFixed(2) : "—"}</td>
          <td class="num">${d.market_price != null ? d.market_price.toFixed(2) : "—"}</td></tr>`);
    $("decisions").innerHTML = isList
      ? "<tr><th>Time</th><th>Action</th><th class='num'>Conviction</th><th>Reason</th></tr>" + rows.join("")
      : "<tr><th>Market</th><th class='num'>LLM P</th><th class='num'>Mkt P</th></tr>" + rows.join("");
  }
}

async function load() {
  const buttons = await Promise.all(BOOKS.map(async ([file, name]) => {
    try {
      const r = await fetch("output/" + file, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      return { file, name, data: await r.json(), ok: true };
    } catch (e) { return { file, name, ok: false }; }
  }));
  $("botlist").innerHTML = buttons.map(b =>
    `<button class="bot-btn ${b.ok ? "" : "err"} ${b.file === selected ? "active" : ""}"
      ${b.ok ? `onclick="pick('${b.file}')"` : "disabled"}>
     <span class="name">${b.name}</span>
     <span class="meta">${b.ok ? (normalize(b.data).saved || "") : "no data yet"}</span>
     </button>`).join("");
  if (!selected) {
    const first = buttons.find(b => b.ok);
    if (first) pick(first.file);
  }
}

async function pick(file) {
  selected = file;
  try {
    const r = await fetch("output/" + file, { cache: "no-store" });
    render(normalize(await r.json()));
  } catch (e) { /* snapshot mid-commit; next refresh fixes it */ }
  load();
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
