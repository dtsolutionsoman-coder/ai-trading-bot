name: bots

# Free 24/7 on public repos: every 15 minutes each bot runs one cycle
# (--once), state files are committed back, GitHub Pages shows the snapshot.
on:
  schedule:
    # GitHub drops many scheduled triggers under load (observed: */15 fired
    # every ~2h). Denser schedule compensates; net effect ~ every 15-30 min.
    # Each run catches up ALL bars missed, so evidence is never lost.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # manual "Run workflow" button

# never two runs writing state at once
concurrency:
  group: bots
  cancel-in-progress: false

permissions:
  contents: write # to commit state updates

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung run must not wedge the concurrency queue
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: restore market-data history
        run: |
          python -m bot.data.transfer --restore output/market_data.jsonl output/market_data.db
          python -m bot.data.transfer --restore output/market_data_mainnet.jsonl output/market_data_mainnet.db

      - name: collector
        run: |
          # testnet is periodically CDN-blocked on shared runner IPs; a soft
          # failure here must not stop mainnet collection or the mainnet books
          python -m bot.data.run --coins BTC,ETH,SOL --once \
            || echo "::warning::testnet collection failed (HL testnet blocked from this runner)"
          python -m bot.data.run --coins BTC,CASHCAT --once --network mainnet --no-funding --db output/market_data_mainnet.db

      - name: race - sma control
        continue-on-error: true # testnet book: survives short HL testnet blocks; ops_health alarms past 2h
        run: python -m bot.live.run --strategy sma_cross --symbol BTC --interval 15m --once --state output/race_sma.json

      - name: race - glm ai
        continue-on-error: true # testnet book: see above
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_THINKING: ${{ secrets.LLM_THINKING }}
        run: python -m bot.live.run --strategy llm_analyst --symbol BTC --interval 15m --every 4 --once --context-db output/market_data.db --state output/live_llm.json

      - name: race - funding carry
        run: python -m bot.live.run --strategy funding_carry --symbol BTC --interval 15m --once --network mainnet --context-db output/market_data_mainnet.db --state output/live_carry.json

      - name: race - funding carry CASHCAT (hot funding)
        run: python -m bot.live.run --strategy funding_carry --symbol CASHCAT --interval 15m --once --network mainnet --context-db output/market_data_mainnet.db --state output/live_carrycat.json

      - name: polymarket
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_THINKING: ${{ secrets.LLM_THINKING }}
        run: python -m bot.pol.run --once

      - name: export market-data history
        if: always() # commit whatever state exists even if a bot step failed
        run: |
          python -m bot.data.transfer --export output/market_data.db output/market_data.jsonl
          python -m bot.data.transfer --export output/market_data_mainnet.db output/market_data_mainnet.jsonl

      - name: commit state
        if: always()
        run: |
          git config user.name "aitb-bot"
          git config user.email "actions@github.com"
          git add output
          if git diff --cached --quiet; then
            echo "no state changes this cycle"
          else
            git commit -m "state update [skip ci]"
            # Two trigger sources (cron-job.org heartbeat + GitHub's own */5
            # scheduler) can slip past the concurrency gate seconds apart and
            # push near-simultaneously; the loser gets "fetch first" rejected.
            # Rebase onto the winner (our fresh state wins conflicts) and retry.
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then
                exit 0
              fi
              echo "push attempt $attempt rejected; rebasing and retrying"
              sleep 10
            done
            echo "::error::could not push state after 3 attempts"
            exit 1
          fi

      - name: health gate
        if: always()
        run: python -m bot.ops_health
        # soft-failed testnet books stay silent only while fresher than 2h;
        # a persistent outage fails the run here (one alarm per cycle after
        # the grace window, state already committed above)
